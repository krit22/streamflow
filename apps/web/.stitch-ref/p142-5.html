<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Location Permission</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13a4ec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101c22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="flex flex-col h-screen">
<main class="flex-grow flex flex-col items-center justify-center text-center px-6">
<div class="flex items-center justify-center w-32 h-32 bg-primary/10 dark:bg-primary/20 rounded-full mb-8">
<span class="material-symbols-outlined text-primary" style="font-size: 80px;">
                    location_on
                </span>
</div>
<h1 class="text-2xl font-bold text-black dark:text-white mb-4">
                Find Friends Nearby
            </h1>
<p class="text-gray-600 dark:text-gray-300 max-w-sm mb-12">
                To connect you with people in your area, we need access to your device's location. Your location is only used to find nearby users.
            </p>
<div class="w-full max-w-xs space-y-4">
<button class="w-full bg-primary text-white font-bold py-4 px-4 rounded-full hover:bg-primary/90 transition-colors">
                    Allow Location Access
                </button>
<button class="w-full text-gray-700 dark:text-gray-300 font-bold py-4 px-4 rounded-full bg-gray-200 dark:bg-gray-700/50 hover:bg-gray-300 dark:hover:bg-gray-700/80 transition-colors">
                    Skip for Now
                </button>
</div>
</main>
<footer class="w-full p-4">
<div class="flex justify-center">
<a class="text-sm text-primary hover:underline" href="#">Learn More</a>
</div>
</footer>
</div>

</body></html>
