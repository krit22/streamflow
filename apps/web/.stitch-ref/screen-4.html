<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>

<title>NITMUN Intelligence Archives</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#EAB308", // Amber-500 equivalent for the gold
              "background-light": "#F3F4F6", // Zinc-100

              "sidebar-dark": "#121215", // Slightly lighter than bg-dark
              "surface-dark": "#18181b", // Zinc-900
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
            boxShadow: {

            }
          },
        },
      };
    </script>
<style>::-webkit-scrollbar {

        }

            background: transparent;
        }

            background: #27272a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
        .glass-panel {
            background: rgba(24, 24, 27, 0.4);
            backdrop-filter: blur(12px);

            background: linear-gradient(135deg, #FDE047 0%, #EAB308 100%);
