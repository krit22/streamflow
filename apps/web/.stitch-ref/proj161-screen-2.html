<div class="w-full max-w-[480px] flex flex-col items-center">
<!-- Auth Card -->

<!-- Tab Switcher -->

<button class="pb-4 font-label-md text-label-md transition-soft border-b-2 border-primary text-primary" id="tab-signin" onclick="toggleAuth('signin')">

                        CREATE ACCOUNT
                    </button>
</div>
<!-- Forms Container -->

<!-- Sign In Form -->

<div class="space-y-6">
<div class="relative">

<input class="w-full py-3 bg-transparent border-b border-surface-container text-body-md focus:border-primary transition-colors placeholder:text-secondary-fixed-dim" placeholder="name@cinema.art" type="email"/>
</div>
<div class="relative">
<div class="flex justify-between items-center mb-1">
<label class="block font-label-md text-[10px] text-secondary uppercase tracking-widest">Password</label>
<a class="text-[10px] text-secondary hover:text-primary transition-colors font-label-md" href="#">FORGOT?</a>
</div>
<input class="w-full py-3 bg-transparent border-b border-surface-container text-body-md focus:border-primary transition-colors placeholder:text-secondary-fixed-dim" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full py-4 bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:opacity-90 transition-soft uppercase tracking-widest" type="submit">
                            Sign In
                        </button>
</form>
<!-- Sign Up Form (Hidden by default) -->
<form class="space-y-8 absolute top-0 left-0 w-full transition-soft opacity-0 translate-x-full pointer-events-none" id="form-signup">
<div class="space-y-6">
<div class="relative">
<label class="block font-label-md text-[10px] text-secondary mb-1 uppercase tracking-widest">Full Name</label>
<input class="w-full py-3 bg-transparent border-b border-surface-container text-body-md focus:border-primary transition-colors placeholder:text-secondary-fixed-dim" placeholder="Julian Voss" type="text"/>
</div>
<div class="relative">
<label class="block font-label-md text-[10px] text-secondary mb-1 uppercase tracking-widest">Email Address</label>
<input class="w-full py-3 bg-transparent border-b border-surface-container text-body-md focus:border-primary transition-colors placeholder:text-secondary-fixed-dim" placeholder="name@cinema.art" type="email"/>
</div>
<div class="relative">
<label class="block font-label-md text-[10px] text-secondary mb-1 uppercase tracking-widest">Create Password</label>

<script>
        function toggleAuth(type) {
            const signinForm = document.getElementById('form-signin');
            const signupForm = document.getElementById('form-signup');
            const signinTab = document.getElementById('tab-signin');
            const signupTab = document.getElementById('tab-signup');
            const progressBar = document.getElementById('progress-bar');

            if (type === 'signup') {
                // Forms
                signinForm.classList.add('opacity-0', '-translate-x-full', 'pointer-events-none');
                signupForm.classList.remove('opacity-0', 'translate-x-full', 'pointer-events-none');
                signupForm.classList.add('opacity-100', 'translate-x-0');
                
                // Tabs
                signinTab.classList.replace('border-primary', 'border-transparent');
                signinTab.classList.replace('text-primary', 'text-secondary');
                signupTab.classList.replace('border-transparent', 'border-primary');
                signupTab.classList.replace('text-secondary', 'text-primary');

                // Progress Bar State
                progressBar.style.width = '50%';
            } else {
                // Forms
                signupForm.classList.add('opacity-0', 'translate-x-full', 'pointer-events-none');
                signinForm.classList.remove('opacity-0', '-translate-x-full', 'pointer-events-none');
                signinForm.classList.add('opacity-100', 'translate-x-0');
                
                // Tabs
                signupTab.classList.replace('border-primary', 'border-transparent');
                signupTab.classList.replace('text-primary', 'text-secondary');
                signinTab.classList.replace('border-transparent', 'border-primary');
                signinTab.classList.replace('text-secondary', 'text-primary');

                // Progress Bar State
                progressBar.style.width = '25%';
            }
        }
    </script>
