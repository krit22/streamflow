<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NITMUN Archives AI Typing State</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#cfa53a",
                        "background-light": "#f8f7f6",
                        "background-dark": "#0a0a0b", /* Zinc-950 per request */
                        "surface-dark": "#191A1C",
                    },
                    fontFamily: {
                        "display": ["Manrope", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                    keyframes: {
                        pulseCustom: {
                            '0%, 100%': { opacity: '0.3', transform: 'scale(0.8)' },
                            '50%': { opacity: '1', transform: 'scale(1)' },
                        }
                    },
                    animation: {
                        'pulse-dot-1': 'pulseCustom 1.4s ease-in-out infinite both',
                        'pulse-dot-2': 'pulseCustom 1.4s ease-in-out 0.2s infinite both',
                        'pulse-dot-3': 'pulseCustom 1.4s ease-in-out 0.4s infinite both',
                    }
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar to match the dark theme */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #36332b;
            border-radius: 20px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #cfa53a;
        }
        .glass-panel {
            background: rgba(25, 26, 28, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="relative flex h-screen w-full flex-col bg-background-dark text-white font-display overflow-hidden selection:bg-primary/30 selection:text-primary">
<!-- Ambient Background Spotlight -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute top-[40%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80vw] h-[80vh] bg-[radial-gradient(circle_at_center,_rgba(207,165,58,0.08)_0%,_transparent_60%)] blur-[100px]"></div>
</div>
<!-- Header -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-[#36332b]/40 bg-background-dark/80 backdrop-blur-md px-8 py-4 z-20">
<div class="flex items-center gap-4 text-white">
<div class="flex items-center justify-center w-8 h-8 rounded-lg bg-surface-dark border border-white/5 text-primary">
<span class="material-symbols-outlined text-[20px]">grid_view</span>
</div>
<h2 class="text-gray-200 text-sm font-bold leading-tight tracking-[0.1em] uppercase">NITMUN Intelligence Archives</h2>
</div>
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 text-gray-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">settings</span>
</button>
<div class="w-9 h-9 rounded-full bg-cover bg-center border border-white/10" data-alt="Abstract minimalist grey avatar for user profile" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCGOHo64PwmxJLxSk9bSuyb49dqMR1rV6eNcHpsDocwpdyWf3wqB6KZKEkwIFXvOEovfxyf6DUOZO43uScQop5J91Thau4p8SfA68VE71PspEwlKi6__8l7LGOGDydzDFBuLlUmHFlM1MR95YEbvic4EZKrQ7be3UZEIPZjE0jO4S6-4WpFbBFDpT0DTJ9HerJY7f1_O3eMimlMpkC-d_voU4klCurL2cISG4MHPTxMQQM3q-Xx8kXrD54I1pdciagPgjhtlBd4rQDs');"></div>
</div>
</header>
<!-- Chat Area -->
<main class="flex-1 overflow-y-auto w-full flex flex-col items-center relative z-10 scroll-smooth pb-32">
<div class="w-full max-w-[800px] px-4 py-8 flex flex-col gap-8">
<!-- Timestamp separator -->
<div class="w-full flex justify-center">
<span class="text-[11px] font-medium text-gray-600 uppercase tracking-widest">Today, 14:02 PM</span>
</div>
<!-- User Message -->
<div class="flex justify-end w-full group/message">
<div class="flex flex-col items-end gap-1.5 max-w-[85%] md:max-w-[70%]">
<span class="text-[#b5afa1] text-[11px] font-semibold tracking-wide pr-1 opacity-0 group-hover/message:opacity-100 transition-opacity duration-300">USER_ID_8492</span>
<div class="text-base font-normal leading-relaxed text-gray-100 bg-[#191A1C] px-6 py-4 rounded-2xl rounded-tr-sm shadow-[0_4px_20px_-4px_rgba(0,0,0,0.5)] border border-white/5">
                        Retrieve the analysis on the 2024 summit protocols.
                    </div>
</div>
</div>
<!-- AI Response (Typing State) -->
<div class="flex justify-start w-full group/ai">
<div class="flex flex-col items-start gap-1.5 max-w-[85%] md:max-w-[70%]">
<span class="text-primary/70 text-[11px] font-semibold tracking-wide pl-1 flex items-center gap-2">
                        NITMUN ARCHIVE
                        <span class="w-1.5 h-1.5 rounded-full bg-primary/50 animate-pulse"></span>
</span>
<div class="glass-panel flex items-center gap-4 px-5 py-4 rounded-2xl rounded-tl-sm shadow-[0_10px_30px_-10px_rgba(0,0,0,0.5)] border border-white/5">
<!-- AI Icon -->
<div class="relative flex items-center justify-center w-10 h-10 shrink-0">
<div class="absolute inset-0 bg-primary/10 rounded-full blur-sm"></div>
<span class="material-symbols-outlined text-primary relative z-10" style="font-size: 24px;">inventory_2</span>
</div>
<!-- Separator -->
<div class="h-8 w-px bg-white/10"></div>
<!-- Typing Animation -->
<div class="flex items-center gap-1.5 pl-1">
<div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse-dot-1"></div>
<div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse-dot-2"></div>
<div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse-dot-3"></div>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- Floating Input Area -->
<div class="absolute bottom-0 left-0 w-full z-30 pointer-events-none flex justify-center pb-8 pt-12 bg-gradient-to-t from-background-dark via-background-dark/80 to-transparent">
<div class="pointer-events-auto w-full max-w-[720px] px-4">
<div class="relative group w-full">
<!-- Golden Glow border effect -->
<div class="absolute -inset-[1px] bg-gradient-to-r from-transparent via-primary/40 to-transparent rounded-xl opacity-50 blur-sm group-hover:opacity-80 transition duration-700"></div>
<div class="relative flex items-center w-full glass-panel rounded-xl border border-primary/30 shadow-2xl overflow-hidden transition-all focus-within:border-primary/60">
<!-- Left Icon -->
<div class="pl-4 pr-2 flex items-center justify-center h-full">
<span class="material-symbols-outlined text-gray-500 group-focus-within:text-primary transition-colors">terminal</span>
</div>
<input class="w-full bg-transparent border-none text-gray-200 placeholder-gray-500/80 focus:ring-0 py-4 px-2 text-[15px] font-medium tracking-wide h-14" placeholder="Accessing archives..." type="text" value=""/>
<!-- Right Actions -->
<div class="pr-2 flex items-center gap-1">
<button aria-label="Attach file" class="p-2 rounded-lg text-gray-500 hover:text-white hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-[20px]">attach_file</span>
</button>
<button class="flex items-center justify-center w-9 h-9 rounded-lg bg-primary text-[#171512] hover:bg-[#dcb54e] transition-all hover:scale-105 active:scale-95 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-[20px] font-bold">arrow_forward</span>
</button>
</div>
</div>
</div>
<p class="text-center text-[10px] text-gray-600 mt-3 font-medium tracking-widest uppercase opacity-60">
                Authorized Personnel Only • Encrypted Connection
            </p>
</div>
</div>
</body></html>
